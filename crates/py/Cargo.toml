[package]
name = "docxtpl-native"
description = "PyO3 bindings exposing docxtpl-core as docxtpl._native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
docxtpl-core = { path = "../core" }
pyo3 = { version = "0.29", features = ["extension-module"] }
