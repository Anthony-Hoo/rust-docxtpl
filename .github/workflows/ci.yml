name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  python:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest
          maturin build --release --out dist --interpreter python
          pip install --no-index --find-links dist rust-docxtpl --no-deps
          pip install python-docx docxcompose jinja2 lxml
      - name: Reject mixed install with the upstream distribution
        run: python -c "import docxtpl, importlib.metadata as m; print(docxtpl.__rust_docxtpl_version__); assert [d.metadata['Name'] for d in m.distributions() if d.metadata['Name'].lower()=='docxtpl'] == []"
      - name: Test (from outside the source tree so the wheel is what gets imported)
        run: pytest tests -q -p no:cacheprovider
      - name: Control group (Rust kernels off)
        run: pytest tests -q -p no:cacheprovider -k "facade" 
        env:
          DOCXTPL_NATIVE: "0"
